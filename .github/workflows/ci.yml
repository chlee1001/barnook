name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/*.sh Tests/ReleaseGateTests.sh
      - run: bash Tests/ReleaseGateTests.sh

  swift:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - run: swift test
      # Tart needs nested virtualization, unavailable on hosted macOS runners.
