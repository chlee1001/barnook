# Modified by Chaehyeon Lee (2026): Git-based release flow for the fork.
[tasks.build]
description = "Compile with swift build"
run = "swift build"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.icon]
description = "Rebuild Resources/AppIcon.icns from Resources/AppIcon.png"
run = "scripts/make-icon.sh"

[tasks.run]
description = "Bundle a debug build as BarNookDev.app, install it to /Applications, and open it"
run = "scripts/run.sh"

[tasks.install]
description = "Bundle a release build as BarNook.app, install it to /Applications, and open it"
run = "scripts/run.sh release"

[tasks.release]
description = "Build, sign, notarize and publish the current main commit as vX.Y.Z"
usage = 'arg "<version>" help="X.Y.Z, without the v"'
run = """
set -euo pipefail
scripts/release.sh "${usage_version}"
scripts/publish.sh "${usage_version}"
"""

[tasks.publish]
description = "Create the GitHub release for vX.Y.Z from build/BarNook-X.Y.Z.zip and build/appcast.xml"
usage = 'arg "<version>" help="X.Y.Z, without the v"'
run = 'scripts/publish.sh "${usage_version}"'

[tasks.archive]
description = "Prepare signed release artifacts without tagging or publishing"
usage = 'arg "<version>" help="X.Y.Z, without the v"'
run = 'scripts/release.sh "${usage_version}"'


[tasks.vm-test]
description = "Run the VM tests in a fresh Tart clone of the golden VM (scripts/vm.sh prepare makes it). Args pass through to swift test"
run = 'scripts/vm-test.sh "$@"'
